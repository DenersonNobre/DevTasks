name: CI (Gitea Actions)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-validate:
    name: Lint, Test & DAG Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies (Clean-Room)
        run: dart pub get

      - name: Analyze workspace members
        run: |
          flutter analyze solution/app
          dart analyze solution/api

      - name: Run automated test harness
        run: pwsh tools/test.ps1 -Coverage -Governance -NoPub

      - name: Verify DAG Precedence Gate
        run: pwsh tools/dag-gate.ps1

      - name: Verify Dependency Pin Gate (INV-SEC-11)
        run: pwsh tools/pin-gate.ps1

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test-and-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API container image
        run: docker build -f docker/Dockerfile -t devtasks/api:ci .
