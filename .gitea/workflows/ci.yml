name: CI (Gitea Actions)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-validate:
    name: Lint, Test & DAG Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies (Clean-Room)
        run: dart pub get

      - name: Analyze workspace members
        run: |
          flutter analyze solution/app
          dart analyze solution/api

      - name: Run automated test harness
        run: pwsh tools/test.ps1 -Coverage -Governance -NoPub

      - name: Verify DAG Precedence Gate
        run: pwsh tools/dag-gate.ps1

      - name: Verify Dependency Pin Gate (INV-SEC-11)
        run: pwsh tools/pin-gate.ps1

  test-integration-db:
    name: Integration (PostgreSQL real)
    runs-on: ubuntu-latest
    needs: [test-and-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PostgreSQL 16
        run: |
          docker run -d --name devtasks-pg \
            -e POSTGRES_USER=devtasks \
            -e POSTGRES_PASSWORD=devtasks_pass \
            -e POSTGRES_DB=devtasks_test \
            -p 55432:5432 postgres:16

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 40); do
            if docker exec devtasks-pg pg_isready -U devtasks -d devtasks_test; then
              echo "PostgreSQL pronto em ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL nao respondeu em 40s"
          docker logs devtasks-pg
          exit 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies (Clean-Room)
        run: dart pub get

      # O gate FALHA se DEVTASKS_TEST_DATABASE_URL faltar: sem isso os testes de
      # integracao seriam pulados e o job ficaria verde sem executar SQL algum.
      # sslmode=disable: o postgres:16 efimero do runner nao expoe SSL e o
      # package:postgres exige SslMode.require por default (erro "Server does not
      # support SSL"). DSN restrito ao loopback do runner, sem surface de rede.
      - name: Run DB integration gate (B-2)
        env:
          DEVTASKS_TEST_DATABASE_URL: postgres://devtasks:devtasks_pass@localhost:55432/devtasks_test?sslmode=disable
        run: pwsh tools/test.ps1 -Database -NoPub

      - name: Dump PostgreSQL logs on failure
        if: failure()
        run: docker logs devtasks-pg || true

      - name: Teardown PostgreSQL
        if: always()
        run: docker rm -f devtasks-pg || true

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test-and-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API container image
        run: docker build -f docker/Dockerfile -t devtasks/api:ci .
