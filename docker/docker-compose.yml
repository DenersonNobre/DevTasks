name: devtasks

services:
  postgres:
    container_name: devtasks-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtasks_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devtasks}
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devtasks_postgres_data:/var/lib/postgresql/data
    networks:
      - devtasks_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtasks} -d ${POSTGRES_DB:-devtasks}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    container_name: devtasks-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devtasks/server:latest
    restart: unless-stopped
    environment:
      # Serverpod lê o override de banco por SERVERPOD_DATABASE_* (prefixo obrigatório);
      # chaves sem prefixo são ignoradas em silêncio pelo framework.
      SERVERPOD_DATABASE_HOST: postgres
      SERVERPOD_DATABASE_PORT: 5432
      SERVERPOD_DATABASE_NAME: ${POSTGRES_DB:-devtasks}
      SERVERPOD_DATABASE_USER: ${POSTGRES_USER:-devtasks}
      SERVERPOD_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-devtasks_pass}
      SERVERPOD_RUN_MODE: ${SERVERPOD_RUN_MODE:-development}
    ports:
      - "0.0.0.0:${SERVER_API_PORT:-8080}:8080"
      - "0.0.0.0:${SERVER_INSIGHTS_PORT:-8081}:8081"
      - "0.0.0.0:${SERVER_WEB_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtasks_net

volumes:
  devtasks_postgres_data:
    name: devtasks_postgres_data

networks:
  devtasks_net:
    name: devtasks_net
    driver: bridge
