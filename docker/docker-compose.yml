name: devtasks

services:
  postgres:
    container_name: devtasks-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtasks_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devtasks}
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devtasks_postgres_data:/var/lib/postgresql/data
    networks:
      - devtasks_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devtasks} -d ${POSTGRES_DB:-devtasks}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    container_name: devtasks-api
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devtasks/api:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-devtasks}:${POSTGRES_PASSWORD:-devtasks_pass}@postgres:5432/${POSTGRES_DB:-devtasks}
    ports:
      - "0.0.0.0:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtasks_net

volumes:
  devtasks_postgres_data:
    name: devtasks_postgres_data

networks:
  devtasks_net:
    name: devtasks_net
    driver: bridge
