# Configuração do ambiente de teste (runner headless / CI).
#
# Sem seção `database`: `Features.enableDatabase` deriva da presença da
# configuração, então o stack sobe sem PostgreSQL. Isso mantém a suíte de
# contrato determinística e independente de serviços externos (NFR-03).
# Testes que precisam de banco (auth, EPIC-01 F1.1+) habilitam a seção aqui e
# provisionam PostgreSQL no CI.
apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

webServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

redis:
  enabled: false
  host: localhost
  port: 6379

sessionLogs:
  persistentEnabled: false
  consoleEnabled: false
