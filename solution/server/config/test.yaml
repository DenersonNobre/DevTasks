# Configuração do ambiente de teste (runner headless / CI).
#
# Sem seção `database`: `Features.enableDatabase` deriva da presença da
# configuração, então o stack sobe sem PostgreSQL. Isso mantém a suíte de
# contrato determinística e independente de serviços externos (NFR-03).
# Testes que precisam de banco (auth, EPIC-01 F1.1+) habilitam a seção aqui e
# provisionam PostgreSQL no CI.
apiServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

webServer:
  port: 0
  publicHost: localhost
  publicPort: 0
  publicScheme: http

redis:
  enabled: false
  host: localhost
  port: 6379

# Serverpod 3.4.13 exige configuração de banco uniforme entre run modes no `generate`.
# Os testes de unidade/contrato constroem `ServerpodConfig` próprio (sem banco) e não
# leem este arquivo; a seção existe apenas para satisfazer a uniformidade.
database:
  host: localhost
  port: 5432
  name: devtasks_test
  user: devtasks
  requireSsl: false

sessionLogs:
  persistentEnabled: false
  consoleEnabled: false
