# Template de segredos do servidor. Copie para `config/passwords.yaml`
# (ignorado pelo Git) e preencha os valores do seu ambiente.
#
# Alternativa para containers/CI: variáveis de ambiente
#   SERVERPOD_DATABASE_PASSWORD, SERVERPOD_SERVICE_SECRET, SERVERPOD_REDIS_PASSWORD
# sobrescrevem o arquivo (PasswordManager: arquivo -> ambiente).

shared: {}

development:
  database: 'devtasks_pass'
  serviceSecret: 'dev-local-service-secret-change-me'

production:
  database: 'change-me'
