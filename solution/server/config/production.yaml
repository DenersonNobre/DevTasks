# Configuração do ambiente de produção (container).
# Host/porta/usuário do banco podem ser sobrescritos por SERVERPOD_DATABASE_*;
# a senha vem de SERVERPOD_DATABASE_PASSWORD (nunca versionada).
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

# O servidor de Insights é uma ferramenta de desenvolvimento: desligado em
# produção (também dispensa `serviceSecret`).
database:
  host: postgres
  port: 5432
  name: devtasks
  user: devtasks

redis:
  enabled: false
  host: localhost
  port: 6379

maxRequestSize: 524288

sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: json
