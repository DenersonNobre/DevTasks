name: devtasks_server
description: "Gestão de tarefas para desenvolvedores — servidor Serverpod"
resolution: workspace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  # Stack Serverpod (D-ENG-04 / UC-01.00). Pin exato da versão do CLI + 
  # pubspec.lock versionado (INV-SEC-11); o gerador rejeita ranges.
  serverpod: 3.4.13
  serverpod_auth_server: 3.4.13
  pointycastle: 4.0.0

dev_dependencies:
  serverpod_test: 3.4.13
  test: ^1.25.5

serverpod:
  scripts:
    # Sobe o server aplicando as migrations pendentes.
    start: dart lib/main.dart --apply-migrations
