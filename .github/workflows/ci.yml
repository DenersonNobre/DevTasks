name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-validate:
    name: Lint, Test & DAG Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Resolve dependencies (Clean-Room)
        run: flutter pub get

      - name: Analyze workspace members
        run: |
          flutter analyze solution/app
          flutter analyze solution/server

      - name: Run automated test harness
        run: pwsh tools/test.ps1 -Coverage -Governance

      - name: Verify DAG Precedence Gate
        run: pwsh tools/dag-gate.ps1

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test-and-validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server container image
        run: docker build -f docker/Dockerfile -t devtasks/server:ci .
